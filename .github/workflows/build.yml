name: Build

# Pull requests are built and tested. Every push to main is also released: the last number of the
# newest vX.Y.Z tag goes up by one, both apps are built with that version, and the release (with
# its tag) is published with Claude-Whisper-macOS.zip (macOS) and Claude-Whisper-Windows.zip. A tag
# pushed by hand is released under its own name. A push that only changes documentation or GitHub
# housekeeping files is not built or released.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/assets/**"
      - ".github/dependabot.yml"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Two merges in quick succession must not both pick the same next version.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: false

jobs:
  # Quick checks on Linux; also shows whether runners pick up jobs at all.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell scripts parse
        run: sh -n macos/build.sh macos/test.sh macos/tools/make-icon.sh macos/Resources/claude-whisper-capture

  # The release version, picked once so both apps and the release agree on it. Empty for pull requests.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Pick the release version
        id: pick
        run: |
          TAG=""
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              TAG="$GITHUB_REF_NAME"
            else
              LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
              LATEST=${LATEST:-v0.0.0}
              TAG=$(echo "$LATEST" | awk -F. '{ printf "%s.%s.%d", $1, $2, $3 + 1 }')
            fi
            echo "Releasing $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    runs-on: macos-15
    needs: version
    steps:
      - uses: actions/checkout@v7

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          swiftc --version

      - name: Stamp the version
        if: needs.version.outputs.tag != ''
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${TAG#v}" macos/Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" macos/Resources/Info.plist

      - name: Tests
        run: macos/test.sh

      # With the MACOS_CERT_* secrets set, the app is signed with that Developer ID; without them
      # (a fork's pull request, or before the certificate exists) it is signed ad hoc.
      - name: Import the Developer ID certificate
        id: sign
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "No signing secrets: signing ad hoc"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # An expired certificate can't sign; one close to its end date gets a warning on every build.
          CERT=$(security find-certificate -c "Developer ID Application" -p "$KEYCHAIN")
          END=$(printf '%s\n' "$CERT" | openssl x509 -noout -enddate | cut -d= -f2)
          if ! printf '%s\n' "$CERT" | openssl x509 -noout -checkend 0 >/dev/null; then
            echo "::error::The Developer ID certificate expired on $END. Create a new one in Apple Developer and update the MACOS_CERT_P12 and MACOS_CERT_PASSWORD secrets."
            exit 1
          fi
          if ! printf '%s\n' "$CERT" | openssl x509 -noout -checkend $((60 * 24 * 3600)) >/dev/null; then
            echo "::warning::The Developer ID certificate expires on $END. Renew it and update the MACOS_CERT_P12 and MACOS_CERT_PASSWORD secrets before then."
          fi
          echo "Developer ID certificate valid until $END"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          [ -n "$IDENTITY" ] || { echo "The certificate holds no Developer ID Application identity"; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build (Apple silicon + Intel)
        env:
          SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
        run: macos/build.sh --universal

      # Releases only: Apple checks the signed app and the ticket is stapled to it, so it opens
      # without Gatekeeper's warning, even offline.
      - name: Notarize
        if: github.event_name == 'push' && steps.sign.outputs.identity != '-'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "macos/build/Claude Whisper.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --timeout 90m \
            --output-format json > "$RUNNER_TEMP/notary.json" || true
          rm -f "$RUNNER_TEMP/notary.p8"
          cat "$RUNNER_TEMP/notary.json"
          # Apple usually answers in minutes; a first submission from a new team can take hours.
          STATUS=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status") or "no answer")' "$RUNNER_TEMP/notary.json" 2>/dev/null || echo "no answer")
          [ "$STATUS" = Accepted ] || { echo "::error::Notarization: $STATUS (re-run the job once Apple has answered)"; exit 1; }
          xcrun stapler staple "macos/build/Claude Whisper.app"
          spctl --assess --type execute -vv "macos/build/Claude Whisper.app"

      - name: Remove the signing keychain
        if: always() && steps.sign.outputs.identity != '-'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Zip
        run: ditto -c -k --keepParent "macos/build/Claude Whisper.app" Claude-Whisper-macOS.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Claude-Whisper-macOS
          path: Claude-Whisper-macOS.zip

  windows:
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build (self-contained, one .exe per architecture)
        shell: pwsh
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          $version = if ($env:TAG) { $env:TAG.TrimStart('v') } else { '0.0.0' }
          foreach ($arch in 'x64', 'arm64') {
            dotnet publish windows/ClaudeWhisper.csproj -c Release -r win-$arch -p:Version=$version -o out/$arch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Compress-Archive -Path out/x64/ClaudeWhisper.exe -DestinationPath Claude-Whisper-Windows.zip
          Compress-Archive -Path out/arm64/ClaudeWhisper.exe -DestinationPath Claude-Whisper-Windows-arm64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Claude-Whisper-Windows
          path: |
            Claude-Whisper-Windows.zip
            Claude-Whisper-Windows-arm64.zip

  # One release with both apps, once both have built.
  release:
    runs-on: ubuntu-latest
    needs: [version, build, windows]
    if: github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -l artifacts
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.zip --clobber
          else
            gh release create "$TAG" artifacts/*.zip --target "$GITHUB_SHA" --title "Claude Whisper $TAG" --generate-notes
          fi
