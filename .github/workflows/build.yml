name: Build

# Pull requests are built and tested. Every push to main is also released: the last number of the
# newest vX.Y.Z tag goes up by one, the app is built with that version, and the release (with its
# tag) is published with Claude-Whisper.zip. A tag pushed by hand is released under its own name.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Two merges in quick succession must not both pick the same next version.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: false

jobs:
  # Quick checks on Linux; also shows whether runners pick up jobs at all.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse
        run: sh -n build.sh test.sh tools/make-icon.sh Resources/claude-whisper-capture

  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          swiftc --version

      - name: Pick the release version
        id: version
        if: github.event_name == 'push'
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
            LATEST=${LATEST:-v0.0.0}
            TAG=$(echo "$LATEST" | awk -F. '{ printf "%s.%s.%d", $1, $2, $3 + 1 }')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${TAG#v}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
          echo "Releasing $TAG"

      - name: Tests
        run: ./test.sh

      - name: Build (Apple silicon + Intel, ad-hoc signed)
        run: ./build.sh --universal

      - name: Zip
        run: ditto -c -k --keepParent "build/Claude Whisper.app" Claude-Whisper.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Claude-Whisper
          path: Claude-Whisper.zip

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Claude-Whisper.zip --clobber
          else
            gh release create "$TAG" Claude-Whisper.zip --target "$GITHUB_SHA" --title "Claude Whisper $TAG" --generate-notes
          fi
