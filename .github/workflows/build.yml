name: Build

# Pull requests are built and tested. Every push to main is also released: the last number of the
# newest vX.Y.Z tag goes up by one, both apps are built with that version, and the release (with
# its tag) is published with Claude-Whisper-macOS.zip (macOS) and Claude-Whisper-Windows.zip. A tag
# pushed by hand is released under its own name. A push that only changes documentation or GitHub
# housekeeping files is not built or released.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/assets/**"
      - ".github/dependabot.yml"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Two merges in quick succession must not both pick the same next version.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: false

jobs:
  # Quick checks on Linux; also shows whether runners pick up jobs at all.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse
        run: sh -n macos/build.sh macos/test.sh macos/tools/make-icon.sh macos/Resources/claude-whisper-capture

  # The release version, picked once so both apps and the release agree on it. Empty for pull requests.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the release version
        id: pick
        run: |
          TAG=""
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              TAG="$GITHUB_REF_NAME"
            else
              LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
              LATEST=${LATEST:-v0.0.0}
              TAG=$(echo "$LATEST" | awk -F. '{ printf "%s.%s.%d", $1, $2, $3 + 1 }')
            fi
            echo "Releasing $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    runs-on: macos-15
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          swiftc --version

      - name: Stamp the version
        if: needs.version.outputs.tag != ''
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${TAG#v}" macos/Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" macos/Resources/Info.plist

      - name: Tests
        run: macos/test.sh

      - name: Build (Apple silicon + Intel, ad-hoc signed)
        run: macos/build.sh --universal

      - name: Zip
        run: ditto -c -k --keepParent "macos/build/Claude Whisper.app" Claude-Whisper-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Claude-Whisper-macOS
          path: Claude-Whisper-macOS.zip

  windows:
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build (self-contained, one .exe per architecture)
        shell: pwsh
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          $version = if ($env:TAG) { $env:TAG.TrimStart('v') } else { '0.0.0' }
          foreach ($arch in 'x64', 'arm64') {
            dotnet publish windows/ClaudeWhisper.csproj -c Release -r win-$arch -p:Version=$version -o out/$arch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Compress-Archive -Path out/x64/ClaudeWhisper.exe -DestinationPath Claude-Whisper-Windows.zip
          Compress-Archive -Path out/arm64/ClaudeWhisper.exe -DestinationPath Claude-Whisper-Windows-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Claude-Whisper-Windows
          path: |
            Claude-Whisper-Windows.zip
            Claude-Whisper-Windows-arm64.zip

  # One release with both apps, once both have built.
  release:
    runs-on: ubuntu-latest
    needs: [version, build, windows]
    if: github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -l artifacts
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.zip --clobber
          else
            gh release create "$TAG" artifacts/*.zip --target "$GITHUB_SHA" --title "Claude Whisper $TAG" --generate-notes
          fi
